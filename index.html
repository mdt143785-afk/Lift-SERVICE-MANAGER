<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d9efff">
<title>Daily Servicing Data</title>
<style>
:root{--blue:#073b78;--blue2:#0877d8;--line:#b8d8f2;--bg:#eef7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#15324f}
header{background:linear-gradient(115deg,#ffffff 0%,#e4f3ff 68%,#c6e6ff 100%);color:var(--blue);padding:22px 16px;text-align:center;border-bottom:1px solid #b8dcfa}header h1{margin:0;font-size:clamp(22px,4vw,32px);letter-spacing:.3px}header p{margin:7px 0 0;color:#41698e;font-size:13px}
main{max-width:1200px;margin:22px auto;padding:0 14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}.hint{font-size:13px;color:#56728c}
button{border:0;border-radius:8px;padding:12px 17px;font-weight:700;cursor:pointer;font-size:14px}.pdf{background:#078a45;color:#fff}.clear{background:#fff;color:#8c2c2c;border:1px solid #e5caca}.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 3px 14px #174b7610}
table{border-collapse:collapse;width:100%;min-width:780px;table-layout:fixed}th,td{border:1px solid var(--line);padding:7px;text-align:left}th{background:#073b78;color:#fff;font-size:13px;text-transform:uppercase;letter-spacing:.2px}th:nth-child(1){width:12%}th:nth-child(2){width:21%}th:nth-child(3){width:19%}th:nth-child(4){width:16%}th:nth-child(5){width:32%}td{height:36px}td input{width:100%;border:0;outline:0;background:transparent;padding:5px 3px;font:14px Arial;color:#15324f;min-width:0}td input:focus{background:#eff8ff;outline:1px solid #69b8f0;border-radius:3px}.rownum{font-size:12px;color:#56728c;text-align:center;background:#f2f8fd}
footer{text-align:center;color:#65716b;font-size:12px;padding:18px}
@media(max-width:600px){main{padding:0 8px}.toolbar{align-items:stretch}.toolbar button{flex:1}.hint{width:100%;order:3}}
@page{size:A4 landscape;margin:10mm}
@media print{
 body{background:#fff;color:#000}header{background:#fff!important;color:#000;padding:0 0 8mm;border-bottom:1px solid #777}header h1{font-size:19pt}header p{color:#333;font-size:9pt}main{max-width:none;margin:0;padding:0}.toolbar,footer{display:none!important}.table-wrap{overflow:visible;border:0;box-shadow:none;border-radius:0}table{min-width:0;width:100%;table-layout:fixed}th,td{border:1px solid #555;padding:5px 6px}th{background:#dceeff!important;color:#073b78;font-size:8pt;print-color-adjust:exact;-webkit-print-color-adjust:exact}td{height:25px}td input{font-size:8.5pt;padding:0;color:#000}td input:focus{outline:0;background:transparent}tr{break-inside:avoid}thead{display:table-header-group}
}
</style>
</head>
<body>
<header><h1>Daily Servicing Data</h1><p>Daily Staff &amp; Project Record</p></header>
<main>
<div class="toolbar"><div class="hint">Enter your information manually. Your entries are saved automatically on this device.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="pdf" onclick="downloadPDF()">Download A4 PDF</button><button class="clear" onclick="clearData()">Clear all data</button></div></div>
<div class="table-wrap"><table><thead><tr><th>Staff ID</th><th>Team Leader</th><th>OIL &amp; MOBIL</th><th>Lift Counts</th><th>Project Name</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<footer>Daily Servicing Data</footer>
<script>
const tbody=document.getElementById('rows');
const fields=['staff','leader','oil','lift','project'];
const saved=JSON.parse(localStorage.getItem('dailyServicingData')||'{}');
for(let i=0;i<45;i++){
 const tr=document.createElement('tr');
 fields.forEach((field,j)=>{
  const td=document.createElement('td');
  if(j===0)td.className='rownum';
  const input=document.createElement('input');input.type='text';input.setAttribute('aria-label',`${field} row ${i+1}`);input.value=(saved[i]&&saved[i][field])||'';
  input.addEventListener('input',saveData);td.appendChild(input);tr.appendChild(td);
 });tbody.appendChild(tr);
}
function saveData(){const data=[...tbody.rows].map(row=>Object.fromEntries(fields.map((f,j)=>[f,row.cells[j].querySelector('input').value])));localStorage.setItem('dailyServicingData',JSON.stringify(data));}
function downloadPDF(){window.print();}
function clearData(){if(!confirm('Are you sure you want to clear all 45 rows?'))return;tbody.querySelectorAll('input').forEach(input=>input.value='');localStorage.removeItem('dailyServicingData');}
</script>
</body>
</html>
